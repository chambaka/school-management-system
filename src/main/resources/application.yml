spring:
  application:
    name: school-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8989}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} correctionId=%X{correctionId:--} schoolId=%X{schoolId:--} userId=%X{userId:--} - %msg%n"

sms:
  jwt:
    secret: ${SMS_JWT_SECRET:change-this-to-a-long-random-secret-key-of-at-least-256-bits}
    access-token-ttl: ${SMS_JWT_ACCESS_TTL:PT1H}
    refresh-token-ttl: ${SMS_JWT_REFRESH_TTL:P7D}
  cors:
    allowed-origins: ${SMS_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  super-admin:
    email: ${SMS_SUPER_ADMIN_EMAIL:halo.admin@halo-schools.net}
    password: ${SMS_SUPER_ADMIN_PASSWORD:ChangeMe123!}
    name: ${SMS_SUPER_ADMIN_NAME:Platform Admin}
  password-reset:
    ttl: ${SMS_PASSWORD_RESET_TTL:PT30M}
    include-debug-code: ${SMS_PASSWORD_RESET_DEBUG:false}
  messaging:
    enabled: ${NOTIFICATION_SERVICE_ENABLED:${SMS_MESSAGING_ENABLED:false}}
    base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:7575}
    api-key: ${NOTIFICATION_API_KEY:a7b0f8dc-9a8b-4f61-b6f5-2c4d9e8a1f73}
    sender-id: ${NOTIFICATION_SMS_SENDER_NAME:${SMS_MESSAGING_SENDER:SOLEIL}} #SHULEHUB
    provider: ${NOTIFICATION_SMS_PROVIDER:beem}
    path: ${NOTIFICATION_SERVICE_PATH:/f1/queueNotification}
  uploads:
    dir: ${SMS_UPLOADS_DIR:uploads}
  login-rate-limit:
    max-attempts: ${SMS_LOGIN_RATE_MAX:8}
    window-seconds: ${SMS_LOGIN_RATE_WINDOW:300}
  redis:
    enabled: ${SMS_REDIS_ENABLED:false}
    url: ${SMS_REDIS_URL:redis://localhost:6379}
  push:
    vapid-public: ${SMS_PUSH_VAPID_PUBLIC:}
    vapid-private: ${SMS_PUSH_VAPID_PRIVATE:}
  invoice-reminder:
    enabled: ${SMS_INVOICE_REMINDER_ENABLED:true}
    cron: ${SMS_INVOICE_REMINDER_CRON:0 0 8 * * *}
    zone: ${SMS_INVOICE_REMINDER_ZONE:Africa/Dar_es_Salaam}
  tenancy:
    mode: ${SMS_TENANCY_MODE:multi}
    default-tenant-name: ${SMS_DEFAULT_TENANT_NAME:ShuleHub}
    default-tenant-slug: ${SMS_DEFAULT_TENANT_SLUG:shulehub}
